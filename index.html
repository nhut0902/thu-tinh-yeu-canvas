<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Thu Tình Yêu — E-card 20/10</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="E-card 20/10: particle heart + Matrix LOVE rain + countdown + typewriter wish. Code By NhutCoder Team.">
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/sun0225SUN/photos/img/20210715233345.png">

    <style>
        html, body {
            margin: 0px; width: 100%; height: 100%;
            overflow: hidden; background: #000;
        }
        canvas { position: absolute; width: 100%; height: 100%; }

        .namebox {
            color: #ff5ba5;
            position: absolute; z-index: 9999;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: 1s;
            text-align: center;
            text-shadow: 0 0 30px rgba(255,91,165,0.8);
        }
        .namebox h1 {
            margin: 0 auto;
            font-family: "Comic Sans MS", cursive, sans-serif;
        }

        /* === Typewriter wish (added below namebox) === */
        .wishbox {
            position: absolute; z-index: 9999;
            top: 65%; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 620px;
            text-align: center;
            color: rgba(255,220,235,0.9);
            font-size: clamp(0.85rem, 3vw, 1.15rem);
            line-height: 1.8;
            font-style: italic;
            text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            pointer-events: none;
            padding: 0 16px;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .wishbox.show { opacity: 1; }
        .wishbox .cursor {
            display: inline-block;
            width: 2px; height: 1em;
            background: #ff5ba5;
            margin-left: 2px;
            animation: blink 0.8s steps(2) infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .wishbox .signature {
            display: block;
            margin-top: 16px;
            font-size: 0.85em;
            color: rgba(255,180,200,0.55);
            font-style: normal;
            letter-spacing: 0.05em;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        .wishbox .signature.show { opacity: 1; }
    </style>
</head>

<body>
    <!-- Canvas layers (original, kept as-is) -->
    <canvas id="canvas-matrix" style="position:absolute;width:100%;height:100%;z-index:8888"></canvas>
    <canvas style="position:absolute;width:100%;height:100%;z-index:9999" class="canvas"></canvas>
    <canvas id="pinkboard" style="position:absolute;width:100%;height:100%;z-index:8888"></canvas>

    <!-- Original overlay with tabs (kept from upstream) -->
    <div class="overlay">
        <div class="tabs">
            <div class="tabs-labels"><span class="tabs-label">Commands</span><span class="tabs-label">Info</span><span
                    class="tabs-label">Share</span></div>
            <div class="tabs-panels">
                <ul class="tabs-panel commands">
                </ul>
            </div>
        </div>
    </div>

    <!-- Namebox (original — text overridden by config.js) -->
    <div class="namebox" style="opacity: 0;">
        <h1 id="name-display" style="font-family: 'Comic Sans MS', cursive, sans-serif;">Wuv U ❤ Bao Bao</h1>
    </div>

    <!-- Typewriter wish (appears AFTER namebox — synced with original sequence) -->
    <div class="wishbox" id="wishbox">
        <span id="wish-text"></span><span class="cursor" id="cursor"></span>
        <span class="signature" id="signature"></span>
    </div>

    <!-- Original scripts (countdown + particle sequence + heart animation) -->
    <script src="js/config.js"></script>
    <script src="js/index.js"></script>
    <script src="js/heart.js"></script>
    <script src="js/matrix.js"></script>

    <!-- === Synced wish typewriter — starts AFTER original namebox appears === -->
    <script>
    (function() {
        // === Read config from js/config.js ===
        var cfg = window.ECARD_CONFIG || {
            name: "Wuv U \u2764 Bao Bao",
            wish: "Nh\u00e2n ng\u00e0y 20/10, ch\u00fac em lu\u00f4n xinh \u0111\u1eb9p, r\u1ea1ng r\u1ee1 nh\u01b0 \u0111\u00f3a h\u1ed3ng \u0111\u1ea7u m\u00f9a. Mong m\u1ed7i ng\u00e0y c\u1ee7a em \u0111\u1ec1u ng\u1eadp tr\u00e0n ti\u1ebfng c\u01b0\u1eddi v\u00e0 th\u1eadt nhi\u1ec1u y\u00eau th\u01b0\u01a1ng. C\u1ea3m \u01a1n em \u0111\u00e3 xu\u1ea5t hi\u1ec7n trong cu\u1ed9c \u0111\u1eddi c\u1ee7a anh, khi\u1ebfn th\u1ebf gi\u1edbi n\u00e0y d\u1ecbu d\u00e0ng h\u01a1n r\u1ea5t nhi\u1ec1u. Em l\u00e0 \u0111i\u1ec1u t\u1ed1t \u0111\u1eb9p nh\u1ea5t m\u00e0 anh t\u1eebng c\u00f3.",
            signature: "\u2014 M\u1ed9t ng\u01b0\u1eddi lu\u00f4n ngh\u0129 \u0111\u1ebfn em \u2764"
        };

        // === Override namebox text with config ===
        var nameEl = document.getElementById("name-display");
        if (cfg.name) nameEl.textContent = cfg.name;

        var wishEl = document.getElementById("wish-text");
        var sigEl = document.getElementById("signature");
        var cursorEl = document.getElementById("cursor");
        var wishbox = document.getElementById("wishbox");
        if (cfg.signature) sigEl.textContent = cfg.signature;

        // === Watch for namebox becoming visible (synced with original sequence) ===
        // The original index.js sets namebox opacity = 1 after the particle
        // sequence completes (countdown 3-2-1 → You → Are → My → Love → rectangle).
        // We poll for this change, then start the typewriter 1.5s later.
        var namebox = document.querySelector(".namebox");
        var wishStarted = false;

        function checkNamebox() {
            if (wishStarted) return;
            var opacity = window.getComputedStyle(namebox).opacity;
            if (parseFloat(opacity) >= 0.9) {
                wishStarted = true;
                // Wait 1.5s after name appears, then start typewriter
                setTimeout(startTypewriter, 1500);
            } else {
                // Keep checking every 200ms
                setTimeout(checkNamebox, 200);
            }
        }

        function startTypewriter() {
            wishbox.classList.add("show");
            var text = cfg.wish || "";
            var i = 0;
            var speed = 45; // ms per character

            function type() {
                if (i < text.length) {
                    wishEl.textContent += text.charAt(i);
                    i++;
                    // Slight randomness for natural feel
                    setTimeout(type, speed + Math.random() * speed * 0.4);
                } else {
                    // Typing done — hide cursor, show signature
                    cursorEl.style.display = "none";
                    sigEl.classList.add("show");
                }
            }
            type();
        }

        // Start watching after a short delay (let original scripts load)
        setTimeout(checkNamebox, 500);
    })();
    </script>
